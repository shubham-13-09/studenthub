<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>StudentHub — Animated Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal-light: #8FE3D2;
      --teal: #3FA98A;
      --cycle: 6s;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #0d2c26;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(90vw, 460px);
      aspect-ratio: 1/1.22;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap {
      position: relative;
      width: 82%;
      aspect-ratio: 1/1;
    }

    /* ambient glow behind the mark */
    .glow {
      position: absolute;
      inset: -20%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(143, 227, 210, .5) 0%, rgba(63, 169, 138, .16) 55%, rgba(63, 169, 138, 0) 75%);
      filter: blur(14px);
      opacity: 0;
      animation: glowPulse var(--cycle) ease-in-out infinite;
    }

    @keyframes glowPulse {

      0%,
      58% {
        opacity: 0;
        transform: scale(.9);
      }

      70% {
        opacity: .7;
        transform: scale(1.08);
      }

      78% {
        opacity: .4;
        transform: scale(1);
      }

      86% {
        opacity: .55;
        transform: scale(1.03);
      }

      92% {
        opacity: .4;
      }

      100% {
        opacity: 0;
      }
    }

    /* network ring drawn around the logo */
    svg.ring {
      position: absolute;
      inset: -7%;
      width: 114%;
      height: 114%;
      overflow: visible;
    }

    .ring-path {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-dasharray: 930;
      stroke-dashoffset: 930;
      opacity: 0;
      animation: ringDraw var(--cycle) cubic-bezier(.3, .7, .3, 1) infinite;
    }

    @keyframes ringDraw {

      0%,
      20% {
        opacity: 0;
        stroke-dashoffset: 930;
      }

      40% {
        opacity: .95;
        stroke-dashoffset: 0;
      }

      88% {
        opacity: .95;
      }

      100% {
        opacity: 0;
      }
    }

    .node {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: nodePulse var(--cycle) ease-in-out infinite;
    }

    @keyframes nodePulse {

      0%,
      34% {
        opacity: 0;
        transform: scale(.3);
      }

      44% {
        opacity: 1;
        transform: scale(1);
      }

      88% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(.5);
      }
    }

    /* particles converging toward the mark */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8FE3D2;
      box-shadow: 0 0 9px 1px rgba(143, 227, 210, .85);
      opacity: 0;
      animation: particleConverge var(--cycle) cubic-bezier(.25, .7, .3, 1) infinite;
    }

    @keyframes particleConverge {
      0% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(1);
      }

      5% {
        opacity: 1;
      }

      26% {
        opacity: 1;
        transform: translate(calc(var(--dx)*.15), calc(var(--dy)*.15)) scale(.5);
      }

      32% {
        opacity: 0;
        transform: translate(0, 0) scale(0);
      }

      100% {
        opacity: 0;
        transform: translate(0, 0) scale(0);
      }
    }

    /* the actual logo image */
    .logo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      opacity: 0;
      transform: scale(.55) rotate(-6deg);
      animation: logoIn var(--cycle) cubic-bezier(.2, .85, .25, 1.15) infinite;
    }

    @keyframes logoIn {

      0%,
      18% {
        opacity: 0;
        transform: scale(.55) rotate(-6deg);
      }

      32% {
        opacity: 1;
        transform: scale(1.06) rotate(1deg);
      }

      40% {
        transform: scale(.98) rotate(0deg);
      }

      46% {
        transform: scale(1.015);
      }

      52% {
        transform: scale(1);
      }

      88% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1);
      }
    }

    .wordmark {
      margin-top: 7%;
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(28px, 6.5vw, 42px);
      letter-spacing: .3px;
      background: linear-gradient(90deg, #3FA98A 0%, #6FCBAF 50%, #C7F3E6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      transform: translateY(16px);
      animation: wordIn var(--cycle) cubic-bezier(.22, .85, .32, 1.1) infinite;
    }

    @keyframes wordIn {

      0%,
      64% {
        opacity: 0;
        transform: translateY(16px);
      }

      78% {
        opacity: 1;
        transform: translateY(0);
      }

      92% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="stage">
    <div class="icon-wrap">
      <div class="glow"></div>

      <div class="particle" style="left:6%;  top:16%; --dx:-48px; --dy:-40px; animation-delay:.00s;"></div>
      <div class="particle" style="left:90%; top:12%; --dx:54px;  --dy:-44px; animation-delay:.05s;"></div>
      <div class="particle" style="left:2%;  top:62%; --dx:-56px; --dy:20px;  animation-delay:.10s;"></div>
      <div class="particle" style="left:94%; top:66%; --dx:58px;  --dy:24px;  animation-delay:.03s;"></div>
      <div class="particle" style="left:16%; top:92%; --dx:-32px; --dy:50px;  animation-delay:.14s;"></div>
      <div class="particle" style="left:82%; top:94%; --dx:36px;  --dy:52px;  animation-delay:.08s;"></div>
      <div class="particle" style="left:50%; top:0%;  --dx:0px;   --dy:-58px; animation-delay:.12s;"></div>
      <div class="particle" style="left:50%; top:100%; --dx:0px;  --dy:58px;  animation-delay:.06s;"></div>

      <svg class="ring" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8FE3D2" />
            <stop offset="100%" stop-color="#3FA98A" />
          </linearGradient>
        </defs>
        <circle class="ring-path" cx="100" cy="100" r="96" />
        <circle class="node" cx="100" cy="4" r="3.4" fill="#8FE3D2" />
        <circle class="node" cx="196" cy="100" r="3.4" fill="#8FE3D2" style="animation-delay:.06s" />
        <circle class="node" cx="100" cy="196" r="3.4" fill="#8FE3D2" style="animation-delay:.12s" />
        <circle class="node" cx="4" cy="100" r="3.4" fill="#8FE3D2" style="animation-delay:.18s" />
      </svg>
      <img class="logo-img" src="studenthub.png" alt="StudentHub Logo">
    </div>

    <div class="wordmark">StudentHub</div>
  </div>


  <script>
    // Splash dikhne ke baad login.html par redirect
    // cycle ab 6s ka hai (pehle 8s tha) — dot se logo aane ka gap bhi kam kar diya gaya hai
    // "StudentHub" wordmark ~4.7s par fully visible hota hai aur ~5.5s tak dikhta hai
    // DURATION_MS ki value change karke aap splash ka time badha/ghata sakte ho
    const DURATION_MS = 5500; // 5.5 second
    setTimeout(function () {
      window.location.href = 'login.html';
    }, DURATION_MS);
  </script>
</body>

</html>
